trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: azureServiceConnection
    value: 'sc-ecommerce-prod'
  - name: acrName
    value: 'acrecommerceprod'
  - name: imageName
    value: 'flask-ecommerce-app'

stages:
  # ==============================================================================
  # STAGE 1: CI (Continuous Integration) - Corre en PRs y pushes para validar
  # ==============================================================================
  - stage: CI_Validation
    displayName: 'CI - Build & Validate Docker Image'
    jobs:
      - job: BuildTest
        displayName: 'Test Docker Build'
        steps:
          - task: Docker@2
            displayName: 'Compilar imagen de prueba (Sin Push)'
            inputs:
              command: 'build'
              Dockerfile: 'Dockerfile'
              tags: |
                $(Build.BuildId)

  # ==============================================================================
  # STAGE 2: CD (Continuous Deployment) - Solo corre en main (Pushes tras Merge)
  # ==============================================================================
  - stage: CD_Deploy
    displayName: 'CD - Push to ACR'
    dependsOn: CI_Validation
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: PushToACR
        displayName: 'Login, Push & Publish'
        steps:
          - task: AzureCLI@2
            displayName: 'Autenticar y Subir Imagen al ACR'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "--- 1. Autenticándose en el ACR usando OIDC ---"
                az acr login --name $(acrName)

                echo "--- 2. Obteniendo el servidor de login del ACR ---"
                ACR_LOGIN_SERVER=$(az acr show --name $(acrName) --query loginServer --output tsv)

                echo "--- 3. Construyendo y etiquetando la imagen ---"
                docker build -t $ACR_LOGIN_SERVER/$(imageName):$(Build.BuildId) -t $ACR_LOGIN_SERVER/$(imageName):latest .

                echo "--- 4. Subiendo la imagen oficialmente al ACR ---"
                docker push $ACR_LOGIN_SERVER/$(imageName):$(Build.BuildId)
                docker push $ACR_LOGIN_SERVER/$(imageName):latest